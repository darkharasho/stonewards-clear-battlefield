<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#4a3a2a"/>
      <stop offset="1" stop-color="#17120d"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#8e9aa4"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3c46b" stop-opacity="0"/>
      <stop offset="1" stop-color="#f3c46b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="36" fill="url(#bg)"/>
  <!-- ground -->
  <ellipse cx="128" cy="196" rx="96" ry="18" fill="#0d0a07" opacity="0.6"/>
  <!-- faded sword left behind -->
  <g opacity="0.28" transform="translate(52 170) rotate(-12)">
    <rect x="0" y="-5" width="88" height="10" rx="3" fill="#b9c2c9"/>
    <rect x="-10" y="-14" width="7" height="28" rx="3" fill="#8a6b45"/>
    <rect x="-30" y="-4" width="20" height="8" rx="3" fill="#5c4630"/>
  </g>
  <!-- sweep arcs -->
  <path d="M40 150 Q128 60 224 110" fill="none" stroke="url(#sweep)" stroke-width="12" stroke-linecap="round"/>
  <path d="M58 172 Q138 98 216 136" fill="none" stroke="url(#sweep)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- sword being lifted away -->
  <g transform="translate(150 86) rotate(-40)">
    <polygon points="0,-9 96,-7 112,0 96,7 0,9" fill="url(#blade)" stroke="#2a2f33" stroke-width="3" stroke-linejoin="round"/>
    <line x1="6" y1="0" x2="92" y2="0" stroke="#6d7780" stroke-width="2"/>
    <rect x="-10" y="-24" width="10" height="48" rx="4" fill="#c7963f" stroke="#2a2f33" stroke-width="3"/>
    <rect x="-40" y="-7" width="30" height="14" rx="5" fill="#6b4b2c" stroke="#2a2f33" stroke-width="3"/>
    <circle cx="-44" cy="0" r="9" fill="#c7963f" stroke="#2a2f33" stroke-width="3"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffe7a8">
    <path d="M206 58 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    <path d="M60 92 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  </g>
</svg>
